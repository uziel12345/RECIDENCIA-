  <!-- Footer -->
  <rect x="80" y="1585" width="2240" height="70" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" rx="12"/>
  <text x="110" y="1625" class="note">Notas: SEARCH_ALIASES guarda referencias polimorficas por entity_type/entity_id y no tiene FK directa. AUDIT_LOGS conserva admin_user_id como referencia operativa sin FK declarada en el esquema actual.</text>
</svg>
