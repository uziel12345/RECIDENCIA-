<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1700" viewBox="0 0 2400 1700" role="img" aria-labelledby="title desc">
  <title id="title">Diagrama Entidad-Relacion - Base de datos Mapa ITO</title>
  <desc id="desc">Diagrama ER de la base de datos PostgreSQL del mapa 3D del Instituto Tecnologico de Oaxaca.</desc>
  <defs>
    <style>
      .bg { fill: #f8fafc; }
      .panel { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2; rx: 16; }
      .panel-title { font: 700 24px Arial, sans-serif; fill: #0f172a; }
      .entity { fill: #ffffff; stroke: #475569; stroke-width: 2; rx: 10; filter: url(#shadow); }
      .entity-main { fill: #fff7ed; stroke: #c2410c; stroke-width: 3; rx: 10; filter: url(#shadow); }
      .header { fill: #1f2937; rx: 10; }
      .header-main { fill: #c2410c; rx: 10; }
      .name { font: 700 17px Arial, sans-serif; fill: #ffffff; }
      .field { font: 14px Consolas, monospace; fill: #1e293b; }
      .pk { fill: #dc2626; font-weight: 700; }
      .fk { fill: #2563eb; font-weight: 700; }
      .note { font: 17px Arial, sans-serif; fill: #475569; }
      .caption { font: 15px Arial, sans-serif; fill: #64748b; }
      .line { fill: none; stroke: #64748b; stroke-width: 2.5; }
      .line-strong { fill: none; stroke: #c2410c; stroke-width: 3; }
      .line-soft { fill: none; stroke: #94a3b8; stroke-width: 2; stroke-dasharray: 8 6; }
      .rel { font: 13px Arial, sans-serif; fill: #334155; }
    </style>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.13"/>
    </filter>
    <marker id="crow" markerWidth="18" markerHeight="18" refX="15" refY="9" orient="auto">
      <path d="M2,2 L15,9 L2,16 M15,9 L2,9" fill="none" stroke="#64748b" stroke-width="2"/>
    </marker>
    <marker id="crowStrong" markerWidth="18" markerHeight="18" refX="15" refY="9" orient="auto">
      <path d="M2,2 L15,9 L2,16 M15,9 L2,9" fill="none" stroke="#c2410c" stroke-width="2.2"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="2400" height="1700"/>
  <text x="80" y="70" style="font: 800 38px Arial, sans-serif; fill:#0f172a;">Diagrama Entidad-Relacion de la base de datos</text>
  <text x="80" y="108" class="note">Sistema de mapa 3D del Instituto Tecnologico de Oaxaca - PostgreSQL</text>
  <text x="80" y="138" class="caption">PK = llave primaria, FK = llave foranea, UK = valor unico. Lineas continuas = relaciones declaradas; lineas punteadas = referencia logica sin FK directa.</text>

  <!-- Panels -->
  <rect class="panel" x="50" y="180" width="520" height="370"/>
  <text class="panel-title" x="80" y="220">Administracion y busqueda</text>
  <rect class="panel" x="620" y="180" width="760" height="670"/>
  <text class="panel-title" x="650" y="220">Catalogo del campus</text>
  <rect class="panel" x="1430" y="180" width="860" height="670"/>
  <text class="panel-title" x="1460" y="220">Tramites, departamentos y cargos</text>
  <rect class="panel" x="50" y="900" width="900" height="640"/>
  <text class="panel-title" x="80" y="940">Area academica</text>
  <rect class="panel" x="1000" y="900" width="1290" height="640"/>
  <text class="panel-title" x="1030" y="940">Geolocalizacion, horarios y referencias del mapa</text>

  <!-- Relationship lines under entities -->
  <path class="line-strong" marker-end="url(#crowStrong)" d="M1000 285 L1000 370"/>
  <path class="line" marker-end="url(#crow)" d="M860 485 L740 485"/>
  <path class="line" marker-end="url(#crow)" d="M860 535 L735 685"/>
  <path class="line" marker-end="url(#crow)" d="M1140 485 L1540 485"/>
  <path class="line" marker-end="url(#crow)" d="M1140 535 L1550 680"/>
  <path class="line" marker-end="url(#crow)" d="M1000 580 L1000 990"/>
  <path class="line" marker-end="url(#crow)" d="M1120 580 L1220 1040"/>
  <path class="line" marker-end="url(#crow)" d="M1130 500 L1400 1110"/>
  <path class="line" marker-end="url(#crow)" d="M1130 520 L1545 1110"/>
  <path class="line" marker-end="url(#crow)" d="M1120 560 L1785 1110"/>
  <path class="line" marker-end="url(#crow)" d="M1120 540 L2060 1110"/>

  <path class="line" marker-end="url(#crow)" d="M1750 485 L1750 610"/>
  <path class="line" marker-end="url(#crow)" d="M1750 485 L1915 610"/>
  <path class="line" marker-end="url(#crow)" d="M1605 485 L1240 485"/>
  <path class="line" marker-end="url(#crow)" d="M1840 725 L1750 520"/>
  <path class="line" marker-end="url(#crow)" d="M1840 725 L1690 1110"/>
  <path class="line" marker-end="url(#crow)" d="M1840 725 L1920 1110"/>

  <path class="line" marker-end="url(#crow)" d="M360 1110 L560 1110"/>
  <path class="line" marker-end="url(#crow)" d="M735 1110 L650 1110"/>
  <path class="line" marker-end="url(#crow)" d="M650 1040 L650 990"/>
  <path class="line" marker-end="url(#crow)" d="M740 485 L740 990"/>
  <path class="line" marker-end="url(#crow)" d="M660 1245 L360 1245"/>
  <path class="line" marker-end="url(#crow)" d="M650 1190 L650 1320"/>

  <path class="line-soft" marker-end="url(#crow)" d="M400 420 C520 610 520 820 900 900"/>
  <path class="line-soft" marker-end="url(#crow)" d="M400 420 C850 650 1450 780 2010 1010"/>

  <!-- Entity helper: x y width height header text fields -->
