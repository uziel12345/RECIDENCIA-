# La autenticacion por contrasena se mantiene temporalmente para no bloquear
# el acceso del responsable. El firewall la limita a Tailscale y a la LAN.
PermitRootLogin yes
PasswordAuthentication yes
PubkeyAuthentication yes
PermitEmptyPasswords no
MaxAuthTries 3
LoginGraceTime 30
X11Forwarding no
ClientAliveInterval 300
ClientAliveCountMax 2
AllowUsers root cds
