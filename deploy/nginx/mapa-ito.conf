map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      '';
}

upstream mapa_ito_node {
    server 127.0.0.1:3001;
    keepalive 32;
}

# Tailscale Funnel termina TLS antes de reenviar la solicitud a Nginx.
map $http_x_forwarded_proto $mapa_forwarded_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name 10.168.0.119 100.76.17.107 recorridovirtual-ito.tailc9c1c3.ts.net _;

    server_tokens off;
    client_max_body_size 35m;

    # Las solicitudes de Funnel ya llegan con X-Forwarded-Proto=https. Las
    # conexiones HTTP directas se envian al nombre publico con TLS valido.
    if ($mapa_forwarded_proto = http) {
        return 308 https://recorridovirtual-ito.tailc9c1c3.ts.net$request_uri;
    }

    # No permitir que archivos ocultos del despliegue caigan en el fallback
    # de la SPA ni que puedan servirse accidentalmente en el futuro.
    location ~ /\. {
        return 404;
    }

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types
        application/javascript
        application/json
        application/manifest+json
        application/xml
        image/svg+xml
        text/css
        text/javascript
        text/plain
        text/xml;

    open_file_cache max=1000 inactive=60s;
    open_file_cache_valid 120s;
    open_file_cache_min_uses 2;
    open_file_cache_errors on;

    location ^~ /assets/ {
        root /var/www/mapa-ito/apps/web/dist;
        try_files $uri =404;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location ^~ /models/ {
        root /var/www/mapa-ito/apps/web/dist;
        default_type model/gltf-binary;
        try_files $uri =404;
        access_log off;
        add_header Cache-Control "public, max-age=86400" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location ~* ^/(?:Portada\.webp|ICONO-TEC\.jpeg|favicon\.svg)$ {
        root /var/www/mapa-ito/apps/web/dist;
        try_files $uri =404;
        access_log off;
        add_header Cache-Control "public, max-age=604800" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location / {
        proxy_pass http://mapa_ito_node;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $mapa_forwarded_proto;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_connect_timeout 10s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}
