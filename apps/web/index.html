<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/jpeg" href="/ICONO-TEC.jpeg" />
    <link rel="apple-touch-icon" href="/ICONO-TEC.jpeg" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />

    <meta name="theme-color" content="#a8442e" />
    <meta name="description" content="Mapa 3D interactivo del Instituto Tecnológico de Oaxaca" />

    <!-- Skill frontend-design: tipografía propia en vez del Inter genérico

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Public+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <title>Mapa 3D ITO</title>
    <script>
      (function(){var t=localStorage.getItem('ito-theme');if(t==='dark')document.documentElement.classList.add('dark');})();
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
