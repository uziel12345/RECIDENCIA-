name: ZAP passive baseline (authorized staging only)

on:
  workflow_dispatch:
    inputs:
      staging_url:
        description: URL HTTPS del staging autorizado (nunca produccion)
        required: true
        type: string
      authorization_confirmed:
        description: Confirmo autorizacion escrita y que el objetivo no es produccion
        required: true
        type: boolean

permissions:
  contents: read
  issues: write

jobs:
  passive-baseline:
    if: inputs.authorization_confirmed
    environment: security-staging
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Validate target
        env:
          TARGET: ${{ inputs.staging_url }}
        run: |
          node -e 'const u=new URL(process.env.TARGET); if(u.protocol!=="https:") throw new Error("Solo se admite HTTPS");'
      - uses: zaproxy/action-baseline@de8ad967d3548d44ef623df22cf95c3b0baf8b25 # v0.15.0
        with:
          target: ${{ inputs.staging_url }}
          docker_name: ghcr.io/zaproxy/zaproxy@sha256:8d387b1a63e3425beef4846e39719f5af2a787753af2d8b6558c6257d7a577a2
          fail_action: false
          allow_issue_writing: true
          artifact_name: zap-staging-report
